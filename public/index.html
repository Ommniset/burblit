<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Burblit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Burblit</h1>

  <div id="register-section">
    <h3>Register</h3>
    <input type="text" id="username-input" placeholder="Enter your username" autocomplete="off" />
    <button type="button" id="connect-button">Connect</button>
    <button type="button" id="reset-button">Reset keys</button>
  </div>

  <div id="chat-section">
    <h3>Chat</h3>

    <label for="mode-select">Key agreement</label>
    <select id="mode-select">
      <option value="auto">Automatic (hybrid when available)</option>
      <option value="hybrid">Require hybrid (X25519 + ML-KEM-768)</option>
      <option value="x25519">Classical only (X25519)</option>
    </select>

    <div id="messages"></div>
    <input type="text" id="recipient-input" placeholder="Send to (username)" autocomplete="off" />
    <input type="text" id="message-input" placeholder="Type a message" autocomplete="off" />
    <button type="button" id="send-button">Send</button>
  </div>

  <script src="bundle.js" defer></script>

</body>
</html>
